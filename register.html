<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Fountain - Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">Hotel Fountain</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="catalogue.html">Catalogue</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="register.html">Registration</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-12 col-md-10 col-lg-8">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">
                    <h2>Customer Registration</h2>
                </div>

                <div class="card-body">

                    <form>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Enter your name" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" placeholder="Enter your email" required>
                            </div>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" placeholder="Enter password" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone Number</label>
                                <input type="tel" class="form-control" placeholder="Enter phone number" required>
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Gender</label>

                            <div>
                                <input type="radio" class="form-check-input" name="gender" id="male">
                                <label class="form-check-label me-3" for="male">
                                    Male
                                </label>

                                <input type="radio" class="form-check-input" name="gender" id="female">
                                <label class="form-check-label" for="female">
                                    Female
                                </label>
                            </div>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">City</label>

                            <select class="form-select">

                                <option selected>Select City</option>
                                <option>Mumbai</option>
                                <option>Pune</option>
                                <option>Nashik</option>
                                <option>Nagpur</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Address</label>

                            <textarea class="form-control"
                                      rows="4"
                                      placeholder="Enter your address"></textarea>

                        </div>

                        <div class="form-check mb-3">

                            <input type="checkbox"
                                   class="form-check-input"
                                   id="terms"
                                   required>

                            <label class="form-check-label" for="terms">
                                I agree to the terms and conditions.
                            </label>

                        </div>

                        <div class="d-grid">

                            <button type="submit" class="btn btn-primary">
                                Register
                            </button>

                        </div>

                    </form>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="login.html">Login Here</a>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<footer class="bg-primary text-white text-center p-3 mt-5">
    <p class="mb-0">© 2026 Hotel Fountain</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
